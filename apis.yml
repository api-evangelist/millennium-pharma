name: Millennium Pharma
description: >-
  Millennium Pharmaceuticals is a biopharmaceutical company founded in 1993 in Cambridge,
  Massachusetts, that pioneered a genomics-based, platform approach to drug discovery and
  development. Backed early on by Mayfield, the company built its reputation on large research
  and development alliances with major pharmaceutical partners and on discovering and
  commercializing medicines for cancer and other diseases. Millennium was acquired by Takeda
  Pharmaceutical Company in 2008 and now operates as the Takeda Oncology unit. It is a
  therapeutics and drug-discovery organization, not an API or developer-platform provider, and
  exposes no public developer portal, API documentation, or SDKs.
